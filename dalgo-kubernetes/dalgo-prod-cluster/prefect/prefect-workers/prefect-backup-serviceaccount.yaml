# Service account for the RDS backup flow-run pods (backup-rds-flow deployments).
# IRSA: role app-dalgo-prod-prefect-backup-s3 trusts system:serviceaccount:prefect:prefect-backup
# and allows read/write/delete on s3://dalgo-postgres-backups only.
# Deployments opt in via job variable {"service_account_name": "prefect-backup"};
# other flows keep running as "default" and get no S3 access.
#
# kubectl --context dalgo-prod apply -f prefect-backup-serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prefect-backup
  namespace: prefect
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::024209611402:role/app-dalgo-prod-prefect-backup-s3
