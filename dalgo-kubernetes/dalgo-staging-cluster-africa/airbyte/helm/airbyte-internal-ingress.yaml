# AFRICA internal ALB for Airbyte. Copy of dalgo-staging-cluster/airbyte/helm/airbyte-internal-ingress.yaml.
# Changed: group.name + Name tag (-af), Africa ACM cert, host airbyte-staging-af-internal.dalgo.org,
# and inbound-cidrs = Mumbai backend EC2 /32 (over peering) + the Africa VPC (flow pods use the same host).
# Placeholders:
#   <AFRICA_ACM_CERT_ARN>   = terraform output -raw acm_certificate_arn in ../../cluster/terraform
#   <MUMBAI_EC2_PRIVATE_IP> = terraform output -raw mumbai_ec2_private_ip in ../../peering
#                             (survives EC2 stop/start, not replacement)
# After the ALB exists: alias A record airbyte-staging-af-internal.dalgo.org -> this ALB in the private zone
# (terraform output airbyte_internal_zone_id in ../../cluster/terraform), by hand, same as Mumbai.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airbyte-internal-ingress
  namespace: airbyte-staging
  annotations:
    # Own ALB group (Africa cluster only)
    alb.ingress.kubernetes.io/group.name: dalgo-staging-af-internal
    # INTERNAL load balancer; private subnets auto-discovered via kubernetes.io/role/internal-elb=1 (af-south-1a, 1b)
    alb.ingress.kubernetes.io/scheme: internal
    # Tags on the ALB, its target groups and SGs
    alb.ingress.kubernetes.io/tags: Name=dalgo-staging-af-airbyte-internal-alb,Product=dalgo,Environment=staging,Subset=airbyte,Region=af-south-1
    # IP targets: ALB -> pod IPs directly
    alb.ingress.kubernetes.io/target-type: ip
    # Connection timeout (30 minutes), same as Mumbai
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=1800
    # HTTPS - listen on both HTTP and HTTPS, redirect HTTP to HTTPS (same as Mumbai)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Africa ACM wildcard cert (af-south-1; the Mumbai cert ARN won't work here)
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:af-south-1:323443472031:certificate/81d5abde-80f6-4cd7-b3ae-acf1675181a9
    # ONLY the Mumbai backend EC2 (Django + Celery). The controller writes this into the ALB's SG.
    alb.ingress.kubernetes.io/inbound-cidrs: 172.31.36.237/32,10.20.0.0/16
    # Health check settings (same as Mumbai)
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
spec:
  # Use AWS Load Balancer Controller (not nginx)
  ingressClassName: alb
  rules:
    - host: airbyte-staging-af-internal.dalgo.org
      http:
        paths:
          # Route /api/v1/connector_builder/ to connector-builder-server
          - path: /api/v1/connector_builder/
            pathType: Prefix
            backend:
              service:
                name: airbyte-airbyte-connector-builder-server-svc
                port:
                  number: 80
          # Route everything else to server
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airbyte-airbyte-server-svc
                port:
                  number: 8001
