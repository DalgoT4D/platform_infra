# Internal Load Balancer with path-based routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airbyte-internal-ingress
  namespace: airbyte
  annotations:
    # Own ALB group: internal and internet-facing Ingresses can't share an ALB
    alb.ingress.kubernetes.io/group.name: dalgo-staging-internal
    # Create INTERNAL load balancer (not internet-facing)
    alb.ingress.kubernetes.io/scheme: internal
    # Private subnets are auto-discovered via the kubernetes.io/role/internal-elb=1 tag
    # Use IP targets for better performance with pods
    alb.ingress.kubernetes.io/target-type: ip
    # Connection timeout (30 minutes)
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=1800
    # HTTPS - listen on both HTTP and HTTPS, redirect HTTP to HTTPS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # ACM wildcard cert: `terraform output acm_certificate_arn` in cluster/terraform
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:323443472031:certificate/2b7e6652-cdd5-4906-8ea9-b2fb08658676
    # Health check settings
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
spec:
  # Use AWS Load Balancer Controller (not nginx)
  ingressClassName: alb
  rules:
    - host: airbyte-staging-internal.dalgo.org
      http:
        paths:
          # Route /api/v1/connector* to connector-builder-server
          - path: /api/v1/connector_builder/
            pathType: Prefix
            backend:
              service:
                name: airbyte-airbyte-connector-builder-server-svc
                port:
                  number: 80
          # Route everything else to server
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airbyte-airbyte-server-svc
                port:
                  number: 8001
