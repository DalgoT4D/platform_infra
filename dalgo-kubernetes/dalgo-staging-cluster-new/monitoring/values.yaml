# kube-prometheus-stack values — dalgo-staging-cluster
# Chart: prometheus-community/kube-prometheus-stack (92.3.0)
#
# - Prometheus, Alertmanager and Grafana all PERSIST to gp3 EBS volumes
# - Grafana is served through the shared public ALB (group dalgo-staging-public)
# - Grafana admin creds come from a pre-created Secret (never committed here)

fullnameOverride: kube-prometheus-stack

# ----------------------------------------------------------------------------
# Prometheus — metrics storage / retention
# ----------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: "45GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits:   { memory: 2Gi }

# ----------------------------------------------------------------------------
# Alertmanager
# ----------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# ----------------------------------------------------------------------------
# Grafana — served via the shared public ALB, persisted to gp3
# ----------------------------------------------------------------------------
grafana:
  service:
    type: ClusterIP            # no dedicated LoadBalancer/ELB
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      # Shared internet-facing ALB (same group as superset)
      alb.ingress.kubernetes.io/group.name: dalgo-staging-public
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      # ACM wildcard cert: `terraform output acm_certificate_arn` in cluster/terraform
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:323443472031:certificate/2b7e6652-cdd5-4906-8ea9-b2fb08658676
      # Applies to the whole ALB, keep the same value on every Ingress in the group
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
    hosts:
      - grafana-staging.dalgo.org
    # TLS is terminated on the ALB with the ACM cert, no k8s TLS secret needed
    tls: []
  grafana.ini:
    server:
      root_url: https://grafana-staging.dalgo.org
  # Admin credentials from a pre-created Secret (do NOT commit a password).
  # Create it first:
  #   kubectl -n monitoring create secret generic grafana-admin \
  #     --from-literal=admin-user=admin \
  #     --from-literal=admin-password='<a-strong-password>'
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
