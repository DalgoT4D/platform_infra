apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  # tags on every EBS volume this class creates (Prometheus, Grafana, Alertmanager disks)
  tagSpecification_1: "Name=dalgo-staging-monitoring-volume"
  tagSpecification_2: "Product=dalgo"
  tagSpecification_3: "Environment=staging"
  tagSpecification_4: "Subset=monitoring"
reclaimPolicy: Retain
# create the disk after the pod is scheduled, in the pod's AZ (nodes are 1a only)
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true